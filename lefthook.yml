pre-commit:
  parallel: true
  commands:
    appraisal:
      glob: "{Gemfile,active_record_properties.gemspec,lib/active_record_properties/version.rb}"
      run: bundle exec appraisal install && git add gemfiles/*.lock
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop --force-exclusion {staged_files}
    rspec:
      run: bundle exec rspec
